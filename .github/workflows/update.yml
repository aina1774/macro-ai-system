name: RaAina Macro Eco — Mise à jour automatique

on:
  schedule:
    - cron: '0 * * * *'  # Toutes les heures
  workflow_dispatch:       # Lancement manuel possible

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Installation Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt

      - name: Collecte des données
        env:
          FRED_API_KEY: ${{ secrets.FREDKEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPIKEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUBKEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGEKEY }}
          DATABASE_URL: ${{ secrets.DATABASEURL }}
          PYTHONUTF8: "1"
        run: python main.py --collect

      - name: Analyse du sentiment
        env:
          FRED_API_KEY: ${{ secrets.FREDKEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPIKEY }}
          DATABASE_URL: ${{ secrets.DATABASEURL }}
          PYTHONUTF8: "1"
        run: python main.py --analyze

      - name: Calcul des scores
        env:
          FRED_API_KEY: ${{ secrets.FREDKEY }}
          DATABASE_URL: ${{ secrets.DATABASEURL }}
          PYTHONUTF8: "1"
        run: python main.py --scores
